# omen.config.toml — versioned tuning values.
# Deployment-specific secrets live in .env / exported environment variables.

[ingestion]
poll_interval_ms = 15_000
max_pages_per_poll = 20

[detection.fresh_wallet]
critical_age_hours = 24
elevated_age_hours = 72
max_txns = 10

[detection.market]
niche_max_volume = 100_000
large_position_min_usd = 1_000
large_position_volume_pct = 0.02

[filters]
# Fills on markets in these categories are dropped in the hot worker before Alchemy profiling: no signals, no alerts.
# sports is classified from Gamma metadata (tags / sportsMarketType / category) and Kalshi series category; the
# detection.excluded_categories.sports keywords plus game-shaped patterns ("win on 2026-10-19", "vs.", "(BO3)", ...)
# are only a fallback when a market has no metadata. Daily counts: Redis omen:hot:market-excluded:<day> and the
# runtime-stats log (marketExcluded). Measure the share it removes with `omen sports-share --days 7`.
exclude_categories = ["sports"]

# Keyword lists (event/market slug + question). weather always applies; sports is the fallback described above.
[detection.excluded_categories]
weather = ["weather", "temperature", "high temperature", "low temperature", "highest temperature", "lowest temperature", "rain", "snow", "hurricane", "tornado", "forecast", "celsius", "fahrenheit", "wind-speed", "wind speed", "humidity", "heatwave", "heat wave", "heat-wave", "frost", "blizzard", "thunderstorm", "precipitation", "dew point", "dew-point", "warmest", "coldest"]
sports = ["football", "soccer", "basketball", "baseball", "hockey", "tennis", "cricket", "rugby", "boxing", "mma", "ufc", "nfl", "nba", "mlb", "nhl", "fifa", "premier league", "premier-league", "la liga", "la-liga", "serie a", "serie-a", "bundesliga", "champions league", "champions-league", "europa league", "europa-league", "world cup", "world-cup", "super bowl", "super-bowl", "both teams to score", "both-teams-to-score", "match result", "match-result", "goal scorer", "goal-scorer", "half-time", "half time", "full-time", "full time"]

[detection.niche_market_entry]
max_market_volume_usd = 100_000
min_fill_usd = 1_000

[detection.conviction_size_mismatch]
max_wallet_total_volume_usd = 5_000
min_fill_to_wallet_volume_ratio = 0.50
longshot_max_price = 0.30
min_fill_usd = 250

[detection.lump_entry]
min_fill_usd = 500
min_lump_ratio = 0.80

[detection.cluster]
min_size = 3
min_fill_usd = 200
elevated_fill_usd = 500
funding_max_depth = 4
fanout_limit = 5
# getAssetTransfers calls per graph (block timestamps come from transfer metadata). 31 = depth 1-3 fully at fanout 5.
max_rpc_calls = 31
same_market_same_side_window_ms = 3_600_000

[alerts]
critical_min_score = 80
high_min_score = 60
medium_min_score = 40
low_min_score = 20
dedup_cooldown_ms = 86_400_000
dedup_score_increase = 10

[operational]
dry_run = false

[backpressure]
hot_worker_queue_depth = 100

[cold_path]
concurrency = 2
rebuild_failure_cooldown_ms = 900000
shutdown_timeout_ms = 30000
# Rebuild funding graphs only for fills >= this size, or for wallets that already triggered any signal.
rebuild_min_fill_usd = 500
rebuild_if_signaled = true

[alchemy]
# CU-weighted token bucket (waits for capacity). Hot + cold = 280 CU/s, under the 330 CU/s free tier.
# Hot only calls Alchemy for fills >= min_profile_fill_usd, so most budget goes to funding-graph rebuilds.
hot_cu_per_second = 120
cold_cu_per_second = 160
max_wait_ms = 20000
max_queue = 500
max_429_retries = 3
# Alchemy chain profiling only for fills >= min_profile_fill_usd (capped at detection.market.large_position_min_usd
# so fresh-wallet, the only signal that needs the on-chain profile, always gets one). Fills between the lowest
# signal min (cluster, $200) and this value are still evaluated with the persisted or conservative profile, at no CU cost.
# Measured 2026-10-12: $500 projected ~1.2-1.7M hot CU/day (~36 new $500+ wallets/h x ~1.4k CU per proxy+controller
# profile). $1000 = fresh-wallet's own minimum, so no signal loses its profile; the code default stays $500.
min_profile_fill_usd = 1_000
# In-memory wallet chain-profile cache TTL (24h).
profile_cache_ttl_ms = 86_400_000
# Postgres-persisted profiles of settled wallets (age past the fresh window, or txns > max_txns): reused across
# restarts for 7 days. Fresh-looking wallets are always re-fetched.
persisted_profile_ttl_ms = 604_800_000
# Daily CU budget (UTC day). 1M/day ~= 30M/month (free tier). Hot gets hot_budget_share, cold the rest.
# Over budget: hot uses the conservative profile (fresh-wallet signals can't fire), cold skips rebuilds.
daily_cu_budget = 1_000_000
# Owner-approved 2026-10-16: hot 40%, cold path 60%.
hot_budget_share = 0.4

[outcomes]
# Grade every signal fill at +1h, +24h and market resolution against ordinary same-market fills of similar size.
enabled = true
interval_ms = 300_000
baseline_per_signal = 3
baseline_window_hours = 6

# M2 backtest recommendation (docs/backtests/m2-public-report-cases.md): wallet < 24h old, <= max_txns, effective price
# < max_price, stake >= min_stake_usd, any market size. score 40 = MEDIUM on its own. deliver = false is SHADOW mode:
# signal events + alerts are stored and graded in trade_outcomes, but never sent to Telegram/Discord or the feed's
# live delivery. Grade it in M1 outcomes for ~2 weeks before setting deliver = true.
[signals.fresh_wallet_longshot]
enabled = true
deliver = true
max_age_hours = 24
max_txns = 10
max_price = 0.30
min_stake_usd = 5_000
score = 40

# Score-only signals: they still add to the wallet's live score (so they lift FRESH_WALLET_* / CONVICTION alerts on
# the same fill), but their own alerts are stored + graded with dispatch_eligible = false and never reach the feed.
[signals.niche_market_entry]
score_only = true

[signals.outsized_position]
score_only = true

[signals.lump_entry]
score_only = true

# SYBIL_CLUSTER (shared-funder wallets entering the same market+side). deliver = false is shadow mode: stored and graded
# in trade_outcomes, never sent to Telegram/feed, and adds nothing to a companion signal's deliverable score. Clusters
# larger than max_cluster_size are exchange / hot-wallet fan-out, not sybils: the cold path never forms them and the
# signal ignores existing ones. excluded_funders (lowercase addresses) are never used as a cluster's shared funder.
# Only the first SYBIL alert per (cluster, market) is kept (Redis omen:sybil:cluster-market:<cluster>:<market>, 30d).
[signals.sybil_cluster]
deliver = false
max_cluster_size = 50
excluded_funders = []

[market_maker]
# insider-poly-bot heuristic (frequency 30 + buy/sell balance 40 + markets 20 + days active 10).
# Likely MMs (score >= min_score) get no live signals and are excluded from baselines.
filter_enabled = true
min_score = 70

# M2: Kalshi public REST (no API key). Signals are stored + graded only, never dispatched.
[kalshi]
enabled = true
trade_poll_ms = 15000
market_cycle_ms = 60000
store_min_notional_usd = 250
large_print_usd = 10000
volume_spike_min_hour_usd = 5000
book_watchlist_size = 40
# Off since 2026-10-19 (noisy, muted anyway): trades, hourly volume and book snapshots are still ingested and
# KALSHI_BLOCK_TRADE / CROSS_VENUE_DIVERGENCE still run (graded only; feed.mute_kalshi keeps them off Telegram).
volume_spike_enabled = false
book_move_enabled = false

# M3: shared alert feed (charr91/smart-money-feed) in its own DB (FEED_DATABASE_URL in .env). omen publishes promoted
# alerts (deliver=true) and mirrors M1 outcomes; the feed process owns Telegram and stays in dry run by default.
[feed]
enabled = true
publish_live_alerts = true
sync_outcomes = true
# Skip omen's own Telegram/Discord while the feed delivers live alerts (needs enabled + FEED_DATABASE_URL + publish_live_alerts).
disable_legacy_channels = true
# Kalshi signals are ingested, enrolled in trade_outcomes and graded, but never delivered (owner decision 2026-10-16:
# 7d Kalshi signals ~-13pp vs baseline). Set false to let fresh Kalshi signals reach the feed's Telegram again.
mute_kalshi = true
# M4: X context for MEDIUM+ alerts via the shared Grok Bot bridge (only while x.source = grokbot).
x_enrich = true
x_min_tier = "MEDIUM"
